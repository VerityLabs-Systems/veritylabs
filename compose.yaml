services:
  postgres:
    image: postgres:16
    container_name: verity-lims-postgres
    environment:
      POSTGRES_DB: verity_lims
      POSTGRES_USER: verity_lims
      POSTGRES_PASSWORD: verity_lims
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verity_lims -d verity_lims"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
