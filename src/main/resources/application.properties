spring.application.name=veritylabs

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/verity_lims}
spring.datasource.username=${DB_USERNAME:verity_lims}
spring.datasource.password=${DB_PASSWORD:verity_lims}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

spring.thymeleaf.cache=false
spring.web.resources.cache.period=0
spring.web.resources.chain.cache=false
