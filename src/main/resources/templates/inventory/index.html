<div xmlns:th="http://www.thymeleaf.org"
th:replace="~{layout/base :: layout(~{:: section})}">

    <section>
        <h1 class="h3 mb-3 text-gray-800">Inventory</h1>

        <div class="row">
            <div class="col-md-4 mb-3">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <div class="text-xs font-weight-bold text-uppercase mb-1">Total reagents</div>
                        <div class="h5 mb-0">--</div>
                    </div>
                </div>
            </div>

            <div class="col-md-4 mb-3">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <div class="text-xs font-weight-bold text-uppercase mb-1">Low stock</div>
                        <div class="h5 mb-0">--</div>
                    </div>
                </div>
            </div>

            <div class="col-md-4 mb-3">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <div class="text-xs font-weight-bold text-uppercase mb-1">Expiring soon</div>
                        <div class="h5 mb-0">--</div>
                    </div>
                </div>
            </div>
        </div>

            <div class="row mt-4">
                <div class="col">
                    <div class="d-flex mt-3">
                        <a class="btn btn-primary" th:href="@{/inventory/entry}"> Register entry</a>
                        <a class="btn btn-outline-primary ml-2" th:href="@{/inventory/consult}">View stock</a>
                    </div>
                </div>
            </div>
    </section>
</div>
