<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::content})}">

<th:block th:fragment="content">

    <section>
        <div class="row justify-content-center">
            <div class="col-xl-6 col-lg-8 col-md-10 ">
                <div class="card shadow-sm">
                    <div class="card-body">

                        <h5 class="mb-4">
                            <i class="fa-solid fa-boxes-stacked me-2"></i>
                            Entrada de Reagente
                        </h5>
                            <form method="post" th:action="@{/inventory/entry}">

                                    <div class="row mb-3">
                                        <div class="col-md-12">
                                            Nome do Item
                                            <input class="form-control" type="text">
                                        </div>

                                        <div class="col-md-6">
                                            <label class="form-label">Tipo:</label>
                                           <select class="form-control">
                                               <option selected disabled value="">Selecione</option>
                                               <option <i class="fa-duotone fa-solid fa-flask-vial"></i> Calibrador</option>
                                               <option><i class="fa-duotone fa-solid fa-flask-vial"></i> Controle</option>
                                               <option>Insumo</option>
                                               <option>Reagente</option>
                                           </select>
                                        </div>
                                    </div>

                         </form>
                    </div>
                </div>
            </div>
        </div>
    </section>
</th:block>


</html>
